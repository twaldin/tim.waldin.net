# Container logs rotate instead of growing without bound (json-file keeps
# everything by default: socket-proxy reached 144 MB and nginx 89 MB).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# A cell runs the session image with cellsh as pid 1. cellsh spawns each
# visitor's sandbox (fresh pid/mount/net/ipc/uts/cgroup namespaces, its own
# cgroup leaf with the session limits, tmpfs-backed overlay root, the session
# seccomp profile and capability set) and serves it to the backend over a unix
# socket on the cell_sockets volume. The capabilities below are the cell's:
# SYS_ADMIN, SYS_CHROOT, MKNOD, NET_ADMIN and SETPCAP build the sandbox, and the
# overlay acts on visitor files with its mounter's credentials, which need
# DAC_OVERRIDE, FOWNER, FSETID, CHOWN and SETFCAP. Visitors keep only SETUID/SETGID.
x-cell: &cell
  image: twaldin/terminal-portfolio:latest
  pull_policy: never
  logging: *logging
  user: "0:0"
  working_dir: /
  hostname: twaldin
  network_mode: none
  read_only: true
  tmpfs:
    - /run:rw,nosuid,nodev,noexec,size=16m,mode=755
  volumes:
    - cell_sockets:/run/cells
  cap_drop:
    - ALL
  cap_add:
    - SYS_ADMIN
    - DAC_OVERRIDE
    - FOWNER
    - FSETID
    - SETFCAP
    - SYS_CHROOT
    - SETUID
    - SETGID
    - SETPCAP
    - MKNOD
    - CHOWN
    - NET_ADMIN
  security_opt:
    - apparmor=unconfined
  cgroup: private
  labels:
    app: terminal-portfolio
    role: cell
  restart: unless-stopped

services:
  # Nginx reverse proxy to route traffic
  nginx:
    image: nginx:alpine
    container_name: term-nginx
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # easl.sh static site (nginx.conf; published by canvas-site scripts/publish.sh)
      - /var/www/easl.sh:/usr/share/nginx/easl.sh:ro
    depends_on:
      - frontend
      - backend
    networks:
      - external-net
      - frontend-net
      - backend-net
    restart: unless-stopped

  # Next.js frontend — isolated network, no internet access
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.production
    container_name: term-frontend
    logging: *logging
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:3001
    expose:
      - "3000"
    networks:
      - frontend-net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=50m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    cap_drop:
      - ALL

  # Docker Socket Proxy (Tecnativa) — URL/method filtering. The body-validating
  # proxy-validator (backend/proxy-validator/) is intentionally NOT in the data
  # path yet: its http-based forward cannot relay dockerode's hijacked `attach`
  # stream, which hung every session lease. It stays in the codebase, tested at
  # the unit level, to be re-introduced once it proxies attach at the raw-socket
  # level. The lifecycle module still only ever requests the hardened spec.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: term-socket-proxy
    logging: *logging
    environment:
      - CONTAINERS=1
      - IMAGES=0
      - POST=1
      - NETWORKS=0
      - VOLUMES=0
      - SERVICES=0
      - TASKS=0
      - NODES=0
      - SWARM=0
      - BUILD=0
      - EXEC=0
      - INFO=1
      - PING=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-net
    restart: unless-stopped

  # Terminal backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: term-backend
    logging: *logging
    environment:
      - NODE_ENV=production
      - FRONTEND_URL=http://frontend:3000
      - DOCKER_HOST=tcp://socket-proxy:2375
      - CELL_SOCKET_DIR=/run/cells
      - ADMIN_EMAIL=timothy@waldin.net
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - backend_data:/app/data
      - cell_sockets:/run/cells
    expose:
      - "3001"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - socket-proxy
      - cell-1
      - cell-2
    networks:
      - backend-net
      - docker-net

  cell-1:
    <<: *cell
    container_name: term-cell-1
    command: ["/usr/local/sbin/cellsh", "/run/cells/cell-1.sock", "/home/portfolio/secure-shell.sh"]

  cell-2:
    <<: *cell
    container_name: term-cell-2
    command: ["/usr/local/sbin/cellsh", "/run/cells/cell-2.sock", "/home/portfolio/secure-shell.sh"]

networks:
  external-net:
    driver: bridge
  frontend-net:
    driver: bridge
    internal: true
  backend-net:
    driver: bridge
    internal: true
  docker-net:
    driver: bridge
    internal: true

volumes:
  backend_data:
  cell_sockets:
