services:
  # Nginx reverse proxy to route traffic
  nginx:
    image: nginx:alpine
    container_name: term-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - external-net
      - frontend-net
      - backend-net
    restart: unless-stopped

  # Next.js frontend — isolated network, no internet access
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.production
    container_name: term-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:3001
    expose:
      - "3000"
    networks:
      - frontend-net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=50m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Docker Socket Proxy (Tecnativa) — URL/method filtering only. It now lives on
  # validator-upstream, NOT docker-net, so the backend cannot bypass the
  # proxy-validator below by dialing :2375 directly.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: term-socket-proxy
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - POST=1
      - NETWORKS=0
      - VOLUMES=0
      - SERVICES=0
      - TASKS=0
      - NODES=0
      - SWARM=0
      - BUILD=0
      - EXEC=0
      - INFO=1
      - PING=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - validator-upstream
    restart: unless-stopped

  # Proxy Validator — body-validating gate between the backend and the Docker
  # API. Forwards GET/inspect and the lifecycle's real container mutations
  # (start/stop/kill/remove/attach/resize), validates POST /containers/create
  # against the frozen SandboxPolicy, and 403s everything else (privileged,
  # host binds, host-net, pulls/builds). The security guarantee that a backend
  # compromise can't create an arbitrary privileged container.
  proxy-validator:
    build:
      context: .
      dockerfile: backend/proxy-validator/Dockerfile
    container_name: term-proxy-validator
    environment:
      - DOCKER_UPSTREAM_HOST=socket-proxy
      - DOCKER_UPSTREAM_PORT=2375
      - PORT=2376
    expose:
      - "2376"
    depends_on:
      - socket-proxy
    networks:
      - docker-net
      - validator-upstream
    restart: unless-stopped

  # Terminal backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: term-backend
    environment:
      - NODE_ENV=production
      - FRONTEND_URL=http://frontend:3000
      - DOCKER_HOST=tcp://proxy-validator:2376
      - ADMIN_EMAIL=timothy@waldin.net
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - backend_data:/app/data
    expose:
      - "3001"
    restart: unless-stopped
    depends_on:
      - proxy-validator
    networks:
      - backend-net
      - docker-net

networks:
  external-net:
    driver: bridge
  frontend-net:
    driver: bridge
    internal: true
  backend-net:
    driver: bridge
    internal: true
  docker-net:
    driver: bridge
    internal: true
  validator-upstream:
    driver: bridge
    internal: true

volumes:
  backend_data:
