name: e2e

# Browser gate for the terminal portfolio. Runs the Playwright suite against the
# live site (BASE_URL) on PRs and pushes to main, and nightly. Make this a
# required branch-protection check so a broken prod is caught before/after merge.
# NOTE: it tests the deployed site, so pair it with the post-deploy e2e step in
# deploy.sh for true deploy gating (that step fails the deploy loudly).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *' # daily prod health check
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run e2e
        working-directory: e2e
        env:
          BASE_URL: ${{ vars.E2E_BASE_URL || 'https://tim.waldin.net' }}
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
